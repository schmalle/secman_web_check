[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "secman-web-check"
version = "0.1.0"
description = "An authorized web-security scanner for SecMan"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpcore>=1.0,<1.1",
  "httpx>=0.27,<0.28",
  "pymysql>=1.1,<2",
  "rich>=13,<14",
  "sslyze>=6.1,<7",
  "typer>=0.12,<1",
]

[dependency-groups]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-httpx>=0.30,<1",
  "ruff>=0.6,<1",
]

[project.scripts]
secman-web-check = "secman_web_check.cli:app"

[tool.setuptools]
packages = [
  "secman_web_check",
  "secman_web_check.checks",
  "secman_web_check.reports",
]
package-dir = { secman_web_check = "src" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.isort]
known-first-party = ["secman_web_check"]

[tool.mypy]
files = ["src"]
strict = true
